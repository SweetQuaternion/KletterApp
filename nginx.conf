# nginx.conf

events {
    # Jeder Worker kann bis zu 1024 Verbindungen gleichzeitig offen halten
    worker_connections 1024; 
}

http {
    # Definiert wo Frontend und Backend Server erreichbar sind
    # die Namen kommen von Docker Compose (nginx löst das automatisch auf)
    # wird dann unten verwendet, um Anfragen weiterzuleiten
    upstream web_servers {
        server frontend:80;
    }

    upstream api_servers {
        server backend:8080;
    }

    upstream keycloak_servers {
        server keycloak:8080;
    }

    server {
        # Definiert einen Server-Block, der auf Port 80 für diese Domain hört
        listen 80;
        server_name $hostname;

        # Frontend Routen - alle sonstigen Anfragen werden hierher geleitet
        location / {
            proxy_pass http://web_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Backend Routen - alle Anfragen mit /api/ werden hierher geleitet
        location /api/ {
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak Routen - alle Anfragen mit /auth/ werden hierher geleitet
        location /auth/ {
            proxy_pass http://keycloak_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check Endpoint - gibt den Status der Anwendung zurück
        location /health {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }
    }
}