services:
  watchtower:
    image: nickfedor/watchtower:1.17.0
    container_name: kletterapp-watchtower
    restart: unless-stopped
    command:
      - "--label-enable"
      - "--interval"
      - "60"
      - "--rolling-restart"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  database:
    image: postgres:18.2
    container_name: kletterapp-database
    env_file: .env
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - kletterapp-data-production:/var/lib/postgresql/
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.5
    container_name: kletterapp-keycloak
    command: start --import-realm --health-enabled=true
    volumes:
      - ./KletterApp-realm.json:/opt/keycloak/data/import/KletterApp-realm.json
      - ./kctheme/kletterapp:/opt/keycloak/themes/kletterapp
    env_file: .env
    environment:
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_ENABLED: "true"
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /auth/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    image: ghcr.io/sweetquaternion/kletterapp-backend:latest
    container_name: kletterapp-backend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - kletterapp-uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/kletterapp-db
      JWT_ISSUER_URI: http://${DOMAIN}/auth/realms/KletterApp
      JWT_JWK_SET_URI: http://keycloak:8080/auth/realms/KletterApp/protocol/openid-connect/certs
    depends_on:
      database:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/sweetquaternion/kletterapp-frontend:latest
    container_name: kletterapp-frontend
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    env_file: .env
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.30.0-alpine
    container_name: kletterapp-nginx
    restart: unless-stopped
    env_file: .env
    hostname: ${DOMAIN}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "3456:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: "exit 0"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  kletterapp-data-production:
    external: true
    name: ${DB_VOLUME_NAME:-kletterapp-data}
  kletterapp-uploads:
    external: true
    name: ${UPLOADS_VOLUME_NAME:-kletterapp-uploads}
