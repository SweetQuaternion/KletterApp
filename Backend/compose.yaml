services:
  Kletterapp-Database:
    image: postgres:18.2
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - kletterapp-db-data:/var/lib/postgresql/18/docker

  Kletterapp-pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    restart: always
    ports:
      - "5050:80"

volumes:
  kletterapp-db-data:
