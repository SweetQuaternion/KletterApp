services:
  Kletterapp-Database:
    image: postgres:18.2
    env_file: .env
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - kletterapp-db-data:/var/lib/postgresql/18/docker
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: "exit 0"

  Kletterapp-pgadmin:
    image: dpage/pgadmin4
    env_file: .env
    restart: unless-stopped
    ports:
      - "5050:80"
    volumes:
      - kletterapp-pgadmin-data:/backups

  Kletterapp-Keycloak:
    image: quay.io/keycloak/keycloak
    command: start-dev
    env_file: .env
    restart: unless-stopped
    ports:
      - "8180:8080"
    depends_on:
      Kletterapp-Database:
        condition: service_healthy

volumes:
  kletterapp-db-data:
  kletterapp-pgadmin-data:
